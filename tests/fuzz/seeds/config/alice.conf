# alice's configuration, to try sts with two people on one computer:
#   terminal 1:  sts -c configs/alice.conf
#   terminal 2:  sts -c configs/bob.conf
#
# alice.conf and bob.conf only differ by the nick and the identity files.
# -c takes no other option: everything is set here. Relative paths are
# relative to this file, "~/" is your home directory.

# --- broker ----------------------------------------------------------------

# Without TLS, on a public broker:
broker = broker.emqx.io
port = 1883
tls = no

# With TLS on your own mosquitto (see doc/TLS.md):
# comment out the three lines above and uncomment these four.
#broker = localhost
#port = 8883
#tls = yes
#tls_ca_file = /etc/mosquitto/certs/ca.crt

# Check the broker's certificate (yes). "no" is for tests only: anyone
# could pretend to be the broker.
#tls_verify = yes

# Only if the broker asks for an account.
#username = alice
#password = secret

# Everyone who wants to talk must use the same prefix.
topic_prefix = wonderland

# --- you ---------------------------------------------------------------------

nick = alice

# The identity key (created on first start, keep it private) and the
# fingerprints of the people met. Each instance needs its own.
identity = ~/.sts/alice.key
known_peers = ~/.sts/alice.peers

# --- rooms -------------------------------------------------------------------

# Rooms to join on start, one per line: "room = NAME" or
# "room = NAME PASSWORD". Both instances must use the same.
room = neotokyo
#room = secret-lab correct-horse-battery-staple

# --- details -----------------------------------------------------------------

# Renew keys every so many seconds (0 = never).
#rekey_interval = 600

# Seconds between keep-alive pings to the broker.
#keepalive = 30

# Interface: auto (full screen on a terminal), tui, or plain (line by line).
#ui = auto

# --- extras ------------------------------------------------------------------

# The largest file you send or accept, with K, M or G. Offers above it
# are refused for you.
#max_file_size = 16M

# Keep a plain text log of each room in log_dir/ROOM.log (private messages
# included, marked). The log is NOT encrypted: anyone who can read your
# files can read it. Off by default.
#log = no
#log_dir = ~/.sts/alice-logs
