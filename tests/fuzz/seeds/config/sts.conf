# sts configuration. Start with:   sts -c configs/sts.conf
#
# Every setting comes from this file: there are no built-in defaults for
# the connection, and -c takes no other option. (To start without a file,
# give everything on the command line instead: sts -b HOST -p PORT ...)
#
# Relative paths are relative to this file, "~/" is your home directory.

# --- broker ----------------------------------------------------------------

# MQTT broker. Messages are end-to-end encrypted, so any broker works: a
# public one like this, or your own (mosquitto). Others: broker.hivemq.com,
# test.mosquitto.org.
broker = broker.emqx.io

# 1883 is plain MQTT, 8883 is MQTT over TLS (then set tls = yes).
port = 1883

# TLS hides the MQTT traffic (topic, timing, sizes) from the network. The
# broker's certificate is checked against the system's authorities, or
# tls_ca_file if set.
tls = no
#tls_ca_file = /path/to/ca.crt
#tls_verify = yes

# Example, TLS on your own mosquitto (see doc/TLS.md):
#   broker = localhost
#   port = 8883
#   tls = yes
#   tls_ca_file = /etc/mosquitto/certs/ca.crt

# Only if your broker asks for them.
#username = me
#password = secret

# Everyone who wants to talk must use the same prefix.
topic_prefix = wonderland

# --- you ---------------------------------------------------------------------

nick = yournickname

# Your identity key (created on first start, keep it private) and the
# fingerprints of the people you have met. One identity per device.
identity = ~/.sts/identity.key
known_peers = ~/.sts/known_peers

# --- rooms -------------------------------------------------------------------

# Rooms to join on start, one per line: "room = NAME" or
# "room = NAME PASSWORD". A password is needed to see or join the room.
room = youroom
#room = secret-lab correct-horse-battery-staple

# --- details -----------------------------------------------------------------

# Renew keys every so many seconds (0 = never): someone who stole your
# current keys can't read what comes after.
#rekey_interval = 600

# Seconds between keep-alive pings to the broker.
#keepalive = 30

# Interface: auto (full screen on a terminal), tui, or plain (line by line).
#ui = auto

# --- extras ------------------------------------------------------------------

# The largest file you send or accept, with K, M or G. Offers above it
# are refused for you.
#max_file_size = 16M

# Keep a plain text log of each room in log_dir/ROOM.log (private messages
# included, marked). The log is NOT encrypted: anyone who can read your
# files can read it. Off by default.
#log = no
#log_dir = ~/.sts/logs
